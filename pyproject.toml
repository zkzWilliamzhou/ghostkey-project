[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ghostkey"
version = "1.0.0"
description = "Find configuration keys that silently do nothing"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["config", "environment", "linter", "static-analysis", "ci"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Quality Assurance",
]

[project.scripts]
ghostkey = "ghostkey.cli:main"

[tool.setuptools]
packages = ["ghostkey"]
